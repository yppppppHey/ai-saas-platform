# RocketMQ Broker 本地开发配置
brokerClusterName = DefaultCluster
brokerName = broker-a
brokerId = 0
deleteWhen = 04
fileReservedTime = 48
brokerRole = ASYNC_MASTER
flushDiskType = ASYNC_FLUSH
# 宿主机上的 Java 客户端需要能连回 broker，指向 Docker Desktop 的宿主地址
brokerIP1 = host.docker.internal
listenPort = 10911
# 本地开发允许自动创建 Topic（生产环境应关闭）
autoCreateTopicEnable = true
