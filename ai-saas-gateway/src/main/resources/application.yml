server:
  port: 8080
  ssl:
    enabled: false  # 生产环境应启用HTTPS

spring:
  application:
    name: ai-saas-gateway
  main:
    web-application-type: reactive
    allow-bean-definition-overriding: true
  autoconfigure:
    exclude:
      # 纯网关不需要数据源；common 传递的 JDBC 类会误触发 DataSource 自动配置
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
  cloud:
    gateway:
      enabled: true
      httpclient:
        connect-timeout: 5000
        response-timeout: 60s
        pool:
          type: elastic
          max-connections: 1000
          max-idle-time: 10s
          max-life-time: 60s
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
          filters:
            - StripPrefix=1
      routes:
        # 用户服务路由（原 /api/v1/** 前缀与控制器实际路径不符，已对齐 /api/auth 等）
        # 诊断期临时移除 CircuitBreaker 过滤器以暴露下游真实异常
        - id: user-service
          uri: lb://ai-saas-user-service
          predicates:
            - Path=/api/auth/**, /api/user/**, /api/role/**, /api/permission/**, /api/vip/**, /api/quota/**
          filters:
            - StripPrefix=0
            - name: Retry
              args:
                retries: 3
                statuses: SERVICE_UNAVAILABLE
                methods: GET

        # 对话服务路由（补齐 ai-chat / prompt-templates 实际路径）
        - id: chat-service
          uri: lb://ai-saas-chat-service
          predicates:
            - Path=/api/v1/ai-chat/**, /api/v1/chat/**, /api/v1/conversations/**, /api/v1/messages/**, /api/v1/prompt-templates/**
          filters:
            - StripPrefix=0
            - name: Retry
              args:
                retries: 3
                statuses: SERVICE_UNAVAILABLE
                methods: GET,POST
            - name: CircuitBreaker
              args:
                name: chatServiceCircuitBreaker
                fallbackUri: forward:/fallback/chat
            - name: RequestRateLimiter
              args:
                rate-limiter: "#{@userRateLimiter}"
                key-resolver: "#{@userKeyResolver}"

        # 任务服务路由
        - id: task-service
          uri: lb://ai-saas-task-service
          predicates:
            - Path=/api/v1/tasks/**
          filters:
            - StripPrefix=0
            - name: Retry
              args:
                retries: 3
                statuses: SERVICE_UNAVAILABLE
                methods: GET,POST,PUT
            - name: CircuitBreaker
              args:
                name: taskServiceCircuitBreaker
                fallbackUri: forward:/fallback/task
            - name: RequestRateLimiter
              args:
                rate-limiter: "#{@userRateLimiter}"
                key-resolver: "#{@userKeyResolver}"

        # RAG服务路由（对齐 knowledge-bases / rag 实际路径）
        - id: rag-service
          uri: lb://ai-saas-rag-service
          predicates:
            - Path=/api/v1/knowledge-bases/**, /api/v1/kb/**, /api/v1/documents/**, /api/v1/rag/**
          filters:
            - StripPrefix=0
            - name: Retry
              args:
                retries: 3
                statuses: SERVICE_UNAVAILABLE
                methods: GET,POST
            - name: CircuitBreaker
              args:
                name: ragServiceCircuitBreaker
                fallbackUri: forward:/fallback/rag

        # 计费服务路由（对齐 /billing/token 实际路径）
        - id: billing-service
          uri: lb://ai-saas-billing-service
          predicates:
            - Path=/api/v1/billing/**, /api/v1/quota/**, /api/v1/token/**, /billing/**
          filters:
            - StripPrefix=0
            - name: Retry
              args:
                retries: 3
                statuses: SERVICE_UNAVAILABLE
                methods: GET
            - name: CircuitBreaker
              args:
                name: billingServiceCircuitBreaker
                fallbackUri: forward:/fallback/billing

        # 管理服务路由
        - id: admin-service
          uri: lb://ai-saas-admin-service
          predicates:
            - Path=/api/v1/admin/**
          filters:
            - StripPrefix=0
            - name: Retry
              args:
                retries: 3
                statuses: SERVICE_UNAVAILABLE
            - name: CircuitBreaker
              args:
                name: adminServiceCircuitBreaker
                fallbackUri: forward:/fallback/admin

        # Actuator端点路由
        - id: actuator
          uri: http://localhost:${server.port}
          predicates:
            - Path=/actuator/**
          filters:
            - StripPrefix=0

        # 网关管理API路由
        - id: gateway-api
          uri: http://localhost:${server.port}
          predicates:
            - Path=/gateway/**
          filters:
            - StripPrefix=0

      # 全局默认过滤器
      # 说明：原全局 RequestRateLimiter 已移除——SCG 4.1.2 的 RedisRateLimiter 在响应提交后
      # 往只读 headers 写 X-RateLimit-*（Tomcat reactive 下必抛 UnsupportedOperationException），
      # 会干扰熔断器误触发兜底。限流改由各路由自行配置。
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST

      # 跨域配置
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods: "*"
            allowedHeaders: "*"
            allowCredentials: false
            maxAge: 3600

    # Nacos配置
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        namespace: ${NACOS_NAMESPACE:}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
        metadata:
          version: 1.0.0
          protocol: http
      config:
        enabled: false
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        namespace: ${NACOS_NAMESPACE:}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
        file-extension: yaml
        import-check:
          enabled: false

    # 禁用 Sentinel 的 Spring Cloud CircuitBreaker 集成：
    # 它会抢占 ReactiveCircuitBreakerFactory（@ConditionalOnMissingBean），导致 resilience4j 工厂退避、
    # 路由里的 CircuitBreaker 过滤器无法注册，网关启动失败。路由熔断由 resilience4j 提供。
    circuitbreaker:
      sentinel:
        enabled: false
        reactive:
          enabled: false

    # Sentinel配置
    sentinel:
      transport:
        dashboard: ${SENTINEL_DASHBOARD:localhost:8858}
      scg:
        fallback:
          mode: response
          response-body: '{"code":429,"message":"系统繁忙，请稍后再试","data":null}'
      # 说明：原 sentinel.datasource.flow/degrade 的 Nacos 规则数据源已移除——
      # 1) classpath 缺 sentinel-datasource-nacos 会启动失败；2) 其依赖 Nacos 配置中心（本地禁用）。
      # 本地限流/熔断规则走代码内默认配置即可。

  # 配置文件导入（本地开发：已禁用 Nacos 配置中心，使用本地 application.yml，故注释掉 Nacos import）
  # config:
  #   import:
  #     - optional:nacos:ai-saas-gateway.yaml

# JWT配置
jwt:
  secret: ${JWT_SECRET:ai-saas-platform-jwt-secret-key-2024}
  access-expiration: ${JWT_ACCESS_EXPIRATION:86400}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800}
  issuer: ${JWT_ISSUER:ai-saas-platform}

# 网关配置
gateway:
  jwt:
    secret: ${JWT_SECRET:ai-saas-platform-jwt-secret-key-2024}
    access-expiration: ${JWT_ACCESS_EXPIRATION:86400}
    refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800}
    issuer: ${JWT_ISSUER:ai-saas-platform}
  rate-limit:
    enabled: true
    default-replenish-rate: 100
    default-burst-capacity: 200
    ip-limit: 50
    user-limit: 100
    api-limit: 200
  security:
    xss-protection: true
    sql-injection-protection: true
    ip-blacklist-enabled: true
    ip-whitelist-enabled: false
    ip-blacklist: []
    ip-whitelist: []
  log:
    access-log-enabled: true
    request-log-enabled: true
    response-log-enabled: true
    performance-log-enabled: true
    slow-request-threshold: 1000
  whitelist:
    - /api/v1/auth/**
    - /api/auth/**
    - /api/v1/users/register
    - /actuator/**
    - /health
    - /swagger-ui/**
    - /v3/api-docs/**
  anonymous-paths: []

# 日志配置
logging:
  level:
    com.aisaas.gateway: INFO
    org.springframework.cloud.gateway: INFO
    org.springframework.security: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{traceId}] %logger{36} - %msg%n"
  file:
    name: logs/gateway.log
    max-size: 100MB
    max-history: 30

# Actuator配置
management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway,prometheus,metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: when_authorized
      show-components: always
    gateway:
      enabled: true
    metrics:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.5, 0.75, 0.95, 0.99

rocketmq:
  name-server: ${ROCKETMQ_NAME_SERVER:localhost:9876}
  producer:
    group: gateway-producer-group
    send-message-timeout: 3000

---
spring:
  config:
    activate:
      on-profile: dev

server:
  port: 8080

logging:
  level:
    com.aisaas.gateway: DEBUG
    org.springframework.cloud.gateway: DEBUG
    org.springframework.security: DEBUG
    reactor.netty: INFO

---
spring:
  config:
    activate:
      on-profile: prod

server:
  port: ${SERVER_PORT:8080}
  ssl:
    enabled: ${SSL_ENABLED:true}
    key-store: ${SSL_KEY_STORE:}
    key-store-password: ${SSL_KEY_STORE_PASSWORD:}
    key-store-type: ${SSL_KEY_STORE_TYPE:PKCS12}

logging:
  level:
    com.aisaas.gateway: WARN
    org.springframework.cloud.gateway: WARN
  file:
    name: /var/log/ai-saas/gateway.log
    max-size: 500MB
    max-history: 90
