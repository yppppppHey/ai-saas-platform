server:
  port: 8082

spring:
  application:
    name: ai-saas-chat-service

  # 数据源配置
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/yuping?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 300000
      connection-timeout: 20000
      auto-commit: true

  # Redis配置
  data:
    redis:
      mode: single
      host: localhost
      port: ${REDIS_PORT:6379}
      password:
      database: 0
      timeout: 60000
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

  # RocketMQ配置
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        namespace: ${NACOS_NAMESPACE:}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
      config:
        enabled: false
        import-check:
          enabled: false
    # OpenFeign 配置：同步调用会阻塞主链路，超时必须短，宁可走降级也不能拖垮对话接口
    openfeign:
      client:
        config:
          default:
            connectTimeout: 2000
            readTimeout: 3000
            loggerLevel: basic
          # 配额校验是发起对话前的强依赖读，超时给得更紧
          ai-saas-billing-service:
            connectTimeout: 1000
            readTimeout: 2000
            loggerLevel: basic
    stream:
      rocketmq:
        binder:
          name-server: ${ROCKETMQ_NAME_SERVER:localhost:9876}
      bindings:
        output:
          destination: chat-message-topic
          content-type: application/json
    # Sentinel 服务层防护（网关层规则见 ai-saas-gateway SentinelConfig）
    sentinel:
      transport:
        dashboard: ${SENTINEL_DASHBOARD:localhost:8858}
      # 启动即与 dashboard 建立连接, 避免首次请求才初始化
      eager: true

# OpenFeign 调用纳入 Sentinel: 每个 Feign 方法自动注册为资源,
# 可在 dashboard/规则中对其做熔断(配合 BillingQuotaClientFallbackFactory 的 fail-open 降级)
feign:
  sentinel:
    enabled: true

# AI Provider配置（含模型智能路由与故障降级，原文件有两个重复的 ai: 顶层键已合并）
ai:
  provider:
    openai:
      api-key: ${OPENAI_API_KEY:}
      base-url: https://api.openai.com/v1
    deepseek:
      api-key: ${DEEPSEEK_API_KEY:}
      base-url: https://api.deepseek.com/v1
  failover:
    default: deepseek-chat
    chains:
      gpt-4: gpt-3.5-turbo,deepseek-chat
      gpt-4-turbo: gpt-3.5-turbo,deepseek-chat
      gpt-3.5-turbo: deepseek-chat
      deepseek-chat: gpt-3.5-turbo

# MyBatis Plus配置
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: assign_id
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  mapper-locations: classpath*:/mapper/**/*.xml

# 日志配置
logging:
  level:
    com.aisaas: debug
    org.springframework.web: info

# RocketMQ（计费链路生产端，RocketMQTemplate 使用）
rocketmq:
  name-server: ${ROCKETMQ_NAME_SERVER:localhost:9876}
  producer:
    group: chat-producer-group
    send-message-timeout: 3000

# 运行监控端点
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
  health:
    redis:
      enabled: true
